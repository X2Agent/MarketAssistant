<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>股票K线图</title>
    <style>
      :root {
        /* 主题变量，默认浅色，由 C# 宿主通过 setTheme('dark'|'light') 动态切换 */
        --chart-bg: #FFFFFF;
        --overlay-bg: rgba(255, 255, 255, 0.9);
        --spinner-ring: rgba(0, 0, 0, 0.1);
        --spinner-accent: #1976D2;
        --error-color: #EF4444;
        --error-bg: rgba(239, 68, 68, 0.1);
      }
      body.theme-dark {
        /* 深色主题 — 对齐设计系统 v2.4（bg-surface / border-default / text-secondary / brand-blue-light） */
        --chart-bg: #111722;
        --overlay-bg: rgba(17, 23, 34, 0.92);
        --spinner-ring: rgba(228, 234, 245, 0.15);
        --spinner-accent: #42A5F5;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, 'Open Sans',  sans-serif;
      }
      #chart-container {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background-color: var(--chart-bg);
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--chart-bg);
      }
      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--overlay-bg);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
        display: none;
      }
      .error-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--overlay-bg);
        color: var(--error-color);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 11;
        flex-direction: column;
        display: none;
      }
      .error-message {
        color: var(--error-color);
        font-size: 14px;
        margin-top: 10px;
        max-width: 80%;
        text-align: center;
        padding: 10px;
        border-radius: 4px;
        background-color: var(--error-bg);
      }
      .spinner {
        border: 4px solid var(--spinner-ring);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: var(--spinner-accent);
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="chart-container">
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
      </div>
      <div class="error-overlay" id="error-overlay">
        <svg
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <div class="error-message" id="error-message">加载数据失败</div>
      </div>
    </div>

    <script>
      // CDN地址配置
      const cdnUrls = [
        'https://unpkg.com/klinecharts@9.6.0/dist/klinecharts.min.js',
        'https://cdn.jsdelivr.net/npm/klinecharts@9.6.0/dist/klinecharts.min.js'
      ];

      // 动态加载脚本函数
      function loadScript(url) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = url;
          script.onload = () => {
            console.log(`成功加载脚本: ${url}`);
            resolve();
          };
          script.onerror = () => {
            console.error(`加载脚本失败: ${url}`);
            reject(new Error(`Failed to load script: ${url}`));
          };
          document.head.appendChild(script);
        });
      }

      // 尝试加载KLineChart库
      async function loadKLineCharts() {
        for (let i = 0; i < cdnUrls.length; i++) {
          try {
            await loadScript(cdnUrls[i]);
            console.log(`KLineChart库加载成功，使用CDN: ${cdnUrls[i]}`);
            initializeChart();
            return;
          } catch (error) {
            console.warn(`CDN ${i + 1} 加载失败: ${cdnUrls[i]}`);
            if (i === cdnUrls.length - 1) {
              console.error('所有CDN都加载失败');
              showError('无法加载图表库，请检查网络连接');
            }
          }
        }
      }

      // 显示错误信息
      function showError(message) {
        const errorOverlay = document.getElementById('error-overlay');
        const errorMessage = document.getElementById('error-message');
        errorMessage.textContent = message;
        errorOverlay.style.display = 'flex';
      }

      // 全局图表变量
       let chart = null;
       let currentTheme = 'light'; // 'light' | 'dark'，由 C# 宿主通过 setTheme 切换

       // 初始化图表
       function initializeChart() {
         if (typeof klinecharts === 'undefined') {
           showError('图表库未正确加载');
           return;
         }

         try {
           // 初始化图表
           chart = klinecharts.init(document.getElementById('chart-container'), {
        // 设置时区
        timezone: 'Asia/Shanghai',
        // 设置语言
        locale: 'zh-CN',
      });

      // 浅色主题样式（对齐设计系统令牌）— 深色差异覆盖见下方 DARK_STYLES
      const LIGHT_STYLES = {
        grid: {
          show: true,
          horizontal: {
            show: true,
            size: 1,
            color: '#E6E9EF',
            style: 'dashed',
          },
          vertical: {
            show: true,
            size: 1,
            color: '#E6E9EF',
            style: 'dashed',
          },
        },
        candle: {
          type: 'candle_solid',
          bar: {
            upColor: '#F44336',
            downColor: '#4CAF50',
            noChangeColor: '#98A2B3',
            upBorderColor: '#F44336',
            downBorderColor: '#4CAF50',
            noChangeBorderColor: '#98A2B3',
            upWickColor: '#F44336',
            downWickColor: '#4CAF50',
            noChangeWickColor: '#98A2B3',
          },
          tooltip: {
            showRule: 'always',
            showType: 'standard',
            labels: ['时间', '开盘', '收盘', '最高', '最低', '成交量'],
            values: null,
            defaultValue: '-',
          },
          priceMark: {
            show: true,
            high: {
              show: true,
              color: '#667085',
              textSize: 12,
              textFamily: 'Consolas',
              textWeight: 'normal',
            },
            low: {
              show: true,
              color: '#667085',
              textSize: 12,
              textFamily: 'Consolas',
              textWeight: 'normal',
            },
            last: {
              show: true,
              upColor: '#F44336',
              downColor: '#4CAF50',
              noChangeColor: '#98A2B3',
              line: {
                show: true,
                style: 'dashed',
                size: 1,
              },
            },
          },
        },
        indicator: {
          tooltip: {
            showRule: 'always',
            showType: 'standard',
            showName: true,
            showParams: true,
            defaultValue: '-',
          },
        },
        xAxis: {
          show: true,
          axisLine: {
            show: true,
            color: '#D0D5DD',
            size: 1,
          },
          tickText: {
            show: true,
            color: '#667085',
            family: 'Consolas',
            weight: 'normal',
            size: 12,
          },
          tickLine: {
            show: true,
            size: 1,
            length: 3,
            color: '#D0D5DD',
          },
        },
        yAxis: {
          show: true,
          position: 'right',
          type: 'normal',
          inside: false,
          axisLine: {
            show: true,
            color: '#D0D5DD',
            size: 1,
          },
          tickText: {
            show: true,
            color: '#667085',
            family: 'Consolas',
            weight: 'normal',
            size: 12,
          },
          tickLine: {
            show: true,
            size: 1,
            length: 3,
            color: '#D0D5DD',
          },
        },
        separator: {
          size: 1,
          color: '#E6E9EF',
          fill: false,
          activeBackgroundColor: 'rgba(25, 118, 210, 0.06)',
        },
        crosshair: {
          show: true,
          horizontal: {
            show: true,
            line: {
              show: true,
              style: 'dashed',
              color: '#98A2B3',
              size: 1,
            },
            text: {
              show: true,
              color: '#FFFFFF',
              size: 12,
              family: 'Consolas',
              weight: 'normal',
              backgroundColor: '#98A2B3',
            },
          },
          vertical: {
            show: true,
            line: {
              show: true,
              style: 'dashed',
              color: '#98A2B3',
              size: 1,
            },
            text: {
              show: true,
              color: '#FFFFFF',
              size: 12,
              family: 'Consolas',
              weight: 'normal',
              backgroundColor: '#98A2B3',
            },
          },
        },
      };

      // 深色主题差异覆盖（klinecharts setStyles 为深合并，仅需给出与 LIGHT_STYLES 的差异项）
      const DARK_STYLES = {
        grid: {
          horizontal: { color: '#1E2636' },
          vertical: { color: '#1E2636' },
        },
        candle: {
          bar: {
            noChangeColor: '#5A6680',
            noChangeBorderColor: '#5A6680',
            noChangeWickColor: '#5A6680',
          },
          priceMark: {
            high: { color: '#8894A8' },
            low: { color: '#8894A8' },
            last: { noChangeColor: '#5A6680' },
          },
        },
        xAxis: {
          axisLine: { color: '#1E2636' },
          tickText: { color: '#8894A8' },
          tickLine: { color: '#1E2636' },
        },
        yAxis: {
          axisLine: { color: '#1E2636' },
          tickText: { color: '#8894A8' },
          tickLine: { color: '#1E2636' },
        },
        separator: {
          color: '#1E2636',
          activeBackgroundColor: 'rgba(25, 118, 210, 0.15)',
        },
        crosshair: {
          horizontal: {
            line: { color: '#5A6680' },
            text: { backgroundColor: '#42A5F5' },
          },
          vertical: {
            line: { color: '#5A6680' },
            text: { backgroundColor: '#42A5F5' },
          },
        },
      };

      // 应用主题：切换 CSS 变量 + 图表样式
      function applyChartTheme(theme) {
        document.body.classList.toggle('theme-dark', theme === 'dark');
        if (chart) {
          chart.setStyles(theme === 'dark' ? DARK_STYLES : LIGHT_STYLES);
        }
      }

      // 主题切换入口（C# 宿主经 stockChartInterface.setTheme 调用）
      function applyTheme(theme) {
        currentTheme = theme === 'dark' ? 'dark' : 'light';
        applyChartTheme(currentTheme);
      }

      // 按当前主题初始化图表样式
      chart.setStyles(currentTheme === 'dark' ? DARK_STYLES : LIGHT_STYLES);

      // 创建主图指标
      chart.createIndicator('MA', false, {
        size: 2,
        precision: 2,
        params: [5, 10, 20, 60],
      });

      // 创建副图指标
      chart.createIndicator('VOL', true, {
        size: 2,
        precision: 0,
      });
      chart.createIndicator('MACD', true, {
        size: 2,
        precision: 2,
      });

      // 定义与C#交互的接口
      window.stockChartInterface = {
        // 加载K线数据
        loadData: function (data) {
          try {
            if (!chart) {
              console.warn('图表尚未初始化，等待图表库加载完成');
              this.setError(true, '图表正在初始化中，请稍候...');
              return;
            }

            console.log('接收到的原始数据:', data);
            const parsedData = typeof data === 'string' ? JSON.parse(data) : data;
            console.log('解析后的数据:', parsedData);
            console.log('数据数量:', parsedData.length);
              
            // 转换数据格式为KLineChart所需格式
            const klineData = parsedData.map((item) => ({
              timestamp: new Date(item.timestamp).getTime(),
              open: item.open,
              high: item.high,
              low: item.low,
              close: item.close,
              volume: item.volume,
              preClose: item.pre_close,
            }));
            
            console.log('转换后的K线数据:', klineData);
            if (klineData.length > 0) {
              console.log('第一条K线数据:', klineData[0]);
            }

            // 设置数据
            chart.applyNewData(klineData);
            console.log('图表数据已应用');

            // 隐藏错误信息
            this.setError(false);
          } catch (error) {
            console.error('处理数据失败:', error);
            this.setError(true, '处理数据失败: ' + error.message);
          }
        },

        // 设置加载状态
        setLoading: function (isLoading) {
          document.getElementById('loading-overlay').style.display = isLoading ? 'flex' : 'none';
        },

        // 设置错误状态
        setError: function (hasError, message) {
          const errorOverlay = document.getElementById('error-overlay');
          errorOverlay.style.display = hasError ? 'flex' : 'none';

          if (hasError && message) {
            document.getElementById('error-message').textContent = message;
          }
        },

        // 切换主题（'light' | 'dark'），由 C# 宿主调用
        setTheme: function (theme) {
          applyTheme(theme);
        },
      };

          // 响应窗口大小变化
          window.addEventListener('resize', function () {
            chart.resize();
          });
        } catch (error) {
          console.error('初始化图表失败:', error);
          showError('初始化图表失败: ' + error.message);
        }
      }

      // 页面加载完成后开始加载KLineChart库
      document.addEventListener('DOMContentLoaded', function() {
        loadKLineCharts();
      });
    </script>
  </body>
</html>

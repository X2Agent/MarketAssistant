name: Run Tests

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # 保留手动触发，便于按需重跑
  # 注意：此前 push 触发器被注释、仅剩 workflow_dispatch，导致 533 个单元测试
  # 在 CI 上从不执行，PR 缺乏质量门禁。此处已恢复自动触发。

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore MarketAssistant.slnx
    
    - name: Build solution
      run: dotnet build MarketAssistant.slnx -c Debug --no-restore
    
    - name: Run tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ZHITU_API_TOKEN: ${{ secrets.ZHITU_API_TOKEN }}
        WEB_SEARCH_API_KEY: ${{ secrets.WEB_SEARCH_API_KEY }}
      run: dotnet test tests/TestMarketAssistant.csproj -c Debug --no-build -s tests/unit.runsettings --logger "trx;LogFileName=test-results.trx"
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'

